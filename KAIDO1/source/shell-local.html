<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAIDO × NOVA</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090711}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#090711}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#090711;color:#eee;font:600 15px Arial,sans-serif;z-index:2;transition:opacity .25s}
#boot.hide{opacity:0;pointer-events:none}
#boot span{opacity:.72}
</style>
</head>
<body>
<div id="boot"><span>جاري فتح التجربة…</span></div>
<iframe id="app" title="KAIDO NOVA Experience" allow="autoplay; fullscreen; clipboard-write"></iframe>
<script>
const PACKED = {kaido:'__KN_PAGE_KAIDO__',nova:'__KN_PAGE_NOVA__'};
const frame = document.getElementById('app');
const boot = document.getElementById('boot');
let loadSequence=0;
let currentPage=null;
const knHtmlCache=new Map();

__KN_SHELL_RUNTIME__

function preparePageHtml(html){const base=new URL('./',location.href).href;return html.replace(/<head([^>]*)>/i,'<head$1><base href="'+base+'">')}
async function cachedPageHtml(page){
 if(!knHtmlCache.has(page))knHtmlCache.set(page,unpackHtml(PACKED[page]).then(async html=>{
   if(location.protocol!=='file:')try{
     const r=await fetch('/api/content',{cache:'no-store',signal:AbortSignal.timeout(6000)});
     if(r.ok){const data=await r.json();const names={kaido:{songs:'songs',dass:'dass',ads:'ads'},nova:{tracks:'NOVA_TRACKS',visuals:'NOVA_VISUALS',audio:'NOVA_AUDIO_ENGINEERING'}};
       for(const [key,name] of Object.entries(names[page]))if(Array.isArray(data[page]?.[key]))html=html.replace(new RegExp('const '+name+'\\s*=\\s*\\[[\\s\\S]*?\\];'),'const '+name+'='+JSON.stringify(data[page][key]).replace(/</g,'\\u003c')+';');
     }
   }catch(_){}
   return preparePageHtml(html);
 }).catch(error=>{knHtmlCache.delete(page);throw error}));
 return knHtmlCache.get(page);
}
async function unpackHtml(b64) {
  if (!('DecompressionStream' in window)) {
    throw new Error('هذا المتصفح قديم ولا يدعم فك الضغط المطلوب. افتح الملف بآخر إصدار من Chrome أو Edge.');
  }
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function stateToHash(page,anchor='') {
  return '#'+page+(anchor?'-'+encodeURIComponent(anchor):'');
}
function hashToState() {
  const h=location.hash.replace(/^#/, '');
  for(const page of ['nova','kaido']){
    if(h===page)return {page,anchor:''};
    if(h.startsWith(page+'-')){try{return {page,anchor:decodeURIComponent(h.slice(page.length+1))}}catch(_){return {page,anchor:''}}}
  }
  return {page:'kaido',anchor:''};
}
async function loadPage(page,anchor='',historyMode='none') {
  if(!PACKED[page])page='kaido';
  const sequence=++loadSequence;
  knLoader.begin(page,sequence);
  try {
    const html=(await cachedPageHtml(page)).replace(/__KN_NAV_ID__/g,String(sequence));
    if(sequence!==loadSequence)return;
    currentPage=page;

    frame.onload=()=>{
      if(sequence!==loadSequence)return;
      if(anchor)frame.contentWindow.postMessage({type:'KN_SCROLL_TO',anchor,navigation:sequence},'*');

      frame.onload=null;
    };
    frame.referrerPolicy='strict-origin-when-cross-origin';
    frame.removeAttribute('src');
    frame.srcdoc=html.replace(/<head([^>]*)>/i,'<head$1><meta name="referrer" content="strict-origin-when-cross-origin">');
    const hash=stateToHash(page,anchor),state={page,anchor};
    if(historyMode==='push')history.pushState(state,'',hash);
    else if(historyMode==='replace')history.replaceState(state,'',hash);
  }catch(err){if(sequence!==loadSequence)return;console.error(err);knLoader.fail(page,sequence,err)}
}
addEventListener('message',e=>{
  if(e.source!==frame.contentWindow)return;
  const d=e.data||{};
  if(d.type==='KIDO_SINGLE_ROUTE')loadPage(d.page==='nova'?'nova':'kaido',d.anchor||'','push');
});
addEventListener('popstate',e=>{const s=e.state||hashToState();loadPage(s.page||'kaido',s.anchor||'','none')});
const initial=hashToState();
loadPage(initial.page,initial.anchor,'replace');
</script>
<style>
#adminDialog{box-sizing:border-box;width:min(1050px,94vw);max-height:90vh;overflow:auto;border:1px solid #708ac355;border-radius:24px;background:radial-gradient(ellipse at top right,#17253c,#090b15 65%);color:#f2f5ff;padding:30px;font:15px/1.8 Tahoma,Arial;box-shadow:0 40px 150px #000b}#adminDialog::backdrop{background:#02040cdd;backdrop-filter:blur(14px)}#adminDialog *{box-sizing:border-box}#adminDialog button,#adminDialog input{font:inherit}#adminDialog button{cursor:pointer;border:1px solid #829ecc55;background:#1b2940;color:white;border-radius:12px;padding:10px 18px}#adminDialog button:hover{border-color:#8edfff}#adminDialog input{width:100%;border:1px solid #879bb855;background:#060b18;color:white;padding:12px;border-radius:10px;margin:6px 0 15px;direction:ltr}#adminDialog label{display:block}#adminDialog h2{margin:0;font-size:29px}#adminDialog .muted{color:#a0b1c9}#adminDialog .top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}#adminDialog form{max-width:440px;margin:25px auto}#adminDialog .owners{display:grid;grid-template-columns:1fr 1fr;gap:20px;direction:rtl}#adminDialog .owner{padding:30px;background:linear-gradient(135deg,#16253b,#111020);border-radius:20px}#adminDialog .owner img{display:block;width:100%;height:210px;object-fit:contain;filter:drop-shadow(0 0 25px #629afa55)}#adminDialog .tabs{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}#adminDialog .active{background:#375982;border-color:#80d5ff}#adminDialog .entry{display:flex;align-items:center;gap:15px;background:#ffffff05;border:1px solid #ffffff12;border-radius:14px;padding:12px;margin:10px 0}#adminDialog .entry img{width:110px;border-radius:8px}#adminDialog .entry a{color:#a2daff;overflow-wrap:anywhere;flex:1;direction:ltr}#adminDialog .danger{color:#ffb7c2;border-color:#dd556755}#adminNotice{min-height:28px;color:#a9e5ff}#adminDialog [hidden]{display:none!important}@media(max-width:600px){#adminDialog{padding:18px}.owners{gap:8px!important}#adminDialog .owner{padding:12px}#adminDialog .owner img{height:130px}#adminDialog .entry{flex-wrap:wrap}#adminDialog .entry img{width:70px}}
</style>
<dialog id="adminDialog" dir="rtl" aria-labelledby="adminTitle"><div class="top"><div><small class="muted">KAIDO × NOVA / CONTROL ROOM</small><h2 id="adminTitle">لوحة الإدارة</h2></div><button id="adminClose" aria-label="إغلاق">✕</button></div><p id="adminNotice" role="status" aria-live="polite"></p><div id="adminBody"></div></dialog>
<script>
(()=>{
const dialog=document.getElementById('adminDialog'),body=document.getElementById('adminBody'),notice=document.getElementById('adminNotice');let csrf='',owner='nova',category='tracks',data={},busy=false;
const labels={nova:{tracks:'من أجمل التراكات',visuals:'أعمال الفيديو',audio:'الهندسة الصوتية'},kaido:{songs:'أعمالي',dass:'الدسات',ads:'الإعلانات'}};
const logos={"nova": "__KN_MEDIA:9885f0396c96__", "kaido": "__KN_MEDIA:f6a938b75ee9__"};
function say(s){notice.textContent=s}
async function api(path,payload){if(location.protocol==='file:')throw Error('شغّل الموقع عبر الخادم المرفق لتفعيل تسجيل الدخول والحفظ.');const r=await fetch('/api/'+path,{method:payload?'POST':'GET',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:payload?JSON.stringify(payload):undefined});let d;try{d=await r.json()}catch(e){throw Error('شغّل الموقع عبر الخادم المرفق لتفعيل تسجيل الدخول والحفظ.')}if(!r.ok)throw Error(d.error||'تعذر تنفيذ الطلب');return d}
function login(){body.innerHTML='<form id="loginForm"><p class="muted">دخول المسؤولين فقط</p><label>اسم المستخدم<input name="username" required autocomplete="username" placeholder="kaido / nova"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><button>متابعة ←</button></form>';body.querySelector('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{await api('login',Object.fromEntries(new FormData(e.target)));say('أدخل رمز التوول لإكمال الدخول.');tool()}catch(e){say(e.message)}finally{busy=false}}}
function tool(){body.innerHTML='<form><label>رمز التوول<input name="code" type="password" required autocomplete="off" autofocus></label><button>فتح لوحة الإدارة</button></form>';body.querySelector('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const r=await api('verify',Object.fromEntries(new FormData(e.target)));csrf=r.csrf;await dashboard();say('تم تسجيل الدخول بنجاح.')}catch(e){say(e.message)}finally{busy=false}}}
async function dashboard(){data=await api('content');body.innerHTML='<div class="top"><p class="muted">اختر الفنان لإدارة قوائمه</p><button id="logout">تسجيل الخروج</button></div><div class="owners"><button class="owner" data-owner="nova"><img alt="NOVA"><b>NOVA / نوفا</b></button><button class="owner" data-owner="kaido"><img alt="KI DO"><b>KI DO / كايدو</b></button></div>';body.querySelectorAll('[data-owner]').forEach(b=>{b.querySelector('img').src=logos[b.dataset.owner];b.onclick=()=>{owner=b.dataset.owner;category=Object.keys(labels[owner])[0];editor()}});body.querySelector('#logout').onclick=async()=>{try{await api('logout',{});csrf='';say('تم تسجيل الخروج.');login()}catch(e){say(e.message)}}}
function editor(){body.innerHTML='<div class="top"><h3>'+owner.toUpperCase()+' / إدارة الأعمال</h3><button id="back">← الفنانين</button></div><div class="tabs"></div><form id="addVideo"><label>رابط فيديو يوتيوب<input name="url" type="url" required placeholder="https://www.youtube.com/watch?v=..."></label><button>＋ إضافة الفيديو</button></form><p class="muted" id="count"></p><div id="entries"></div>';body.querySelector('#back').onclick=()=>dashboard().catch(e=>say(e.message));for(const [key,label]of Object.entries(labels[owner])){const b=document.createElement('button');b.textContent=label;b.className=key===category?'active':'';b.onclick=()=>{category=key;editor()};body.querySelector('.tabs').append(b)}const list=data[owner][category];body.querySelector('#count').textContent=list.length+' فيديو • التغييرات تظهر لكل الزوار';if(!list.length)body.querySelector('#entries').textContent='القائمة فارغة. أضف أول فيديو.';list.forEach(id=>{const row=document.createElement('div');row.className='entry';const im=document.createElement('img');im.src='https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';im.alt='معاينة الفيديو';const a=document.createElement('a');a.href='https://www.youtube.com/watch?v='+id;a.target='_blank';a.rel='noopener noreferrer';a.textContent=id+' ↗';const b=document.createElement('button');b.className='danger';b.textContent='حذف';b.onclick=()=>{if(confirm('حذف هذا الفيديو من القائمة؟'))mutate({action:'delete',url:id})};row.append(im,a,b);body.querySelector('#entries').append(row)});body.querySelector('#addVideo').onsubmit=e=>{e.preventDefault();mutate({action:'add',url:new FormData(e.target).get('url')})}}
async function mutate(change){if(busy)return;busy=true;try{data=await api('content',{owner,category,...change});editor();say(change.action==='add'?'تمت إضافة الفيديو وحفظه.':'تم حذف الفيديو وحفظ التعديل.');knHtmlCache.clear();loadPage(currentPage||'kaido','','replace')}catch(e){say(e.message)}finally{busy=false}}
async function open(){if(!dialog.open)dialog.showModal();say('');try{const s=await api('session');if(s.csrf){csrf=s.csrf;await dashboard()}else login()}catch(e){login();say(e.message)}}
document.getElementById('adminClose').onclick=()=>dialog.close();window.addEventListener('message',e=>{if(e.source===document.getElementById('app').contentWindow&&e.data?.type==='ADMIN_OPEN')open()});
})();
</script>
</body>
</html>
