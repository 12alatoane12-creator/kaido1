<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAIDO × NOVA</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090711}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#090711}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#090711;color:#eee;font:600 15px Arial,sans-serif;z-index:2;transition:opacity .25s}
#boot.hide{opacity:0;pointer-events:none}
#boot span{opacity:.72}

/* KAIDO ↔ NOVA musical transition */
#musicTransition{position:fixed;inset:0;z-index:80;overflow:hidden;pointer-events:none;visibility:hidden;opacity:0;isolation:isolate;background:#070811}
#musicTransition::before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle at 50% 50%,rgba(93,174,255,.2),transparent 34%),conic-gradient(from 230deg at 50% 50%,rgba(63,132,255,.06),transparent 25%,rgba(255,196,92,.045),transparent 55%,rgba(135,86,255,.075),transparent 80%);filter:blur(22px);transform:scale(.9)}
#musicTransition::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(210,242,255,.12),transparent);transform:translateX(-120%) skewX(-12deg);mix-blend-mode:screen}
#musicTransition.active{visibility:visible;opacity:1;animation:mtBackdropIn .3s ease both}
#musicTransition.active::after{animation:mtFlash 1.08s cubic-bezier(.22,.75,.2,1) .08s both}
#musicTransition.to-kaido::before{background:radial-gradient(circle at 50% 50%,rgba(165,112,255,.18),transparent 35%),conic-gradient(from 120deg at 50% 50%,rgba(129,82,255,.08),transparent 30%,rgba(108,190,255,.05),transparent 62%,rgba(255,202,117,.045),transparent 82%)}
.mt-grid{position:absolute;inset:0;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle at center,#000 12%,transparent 76%);transform:scale(1.08)}
.mt-wave{position:absolute;left:-4%;right:-4%;top:50%;height:150px;transform:translateY(-50%);opacity:.64;filter:drop-shadow(0 0 12px rgba(120,199,255,.38))}
.mt-wave svg{width:100%;height:100%;overflow:visible}
.mt-wave path{fill:none;stroke:rgba(190,231,255,.72);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:10 14;vector-effect:non-scaling-stroke}
#musicTransition.active .mt-wave path{animation:mtWaveDash .72s linear infinite,mtWaveGlow 1.08s ease-in-out both}
.to-kaido .mt-wave{filter:drop-shadow(0 0 12px rgba(184,142,255,.34))}.to-kaido .mt-wave path{stroke:rgba(218,198,255,.72)}
.mt-tool{position:absolute;width:clamp(54px,6vw,88px);height:clamp(54px,6vw,88px);display:grid;place-items:center;color:#dff6ff;opacity:0;filter:drop-shadow(0 0 14px rgba(111,196,255,.4));will-change:transform,opacity}
.mt-tool svg{width:100%;height:100%;overflow:visible;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.to-kaido .mt-tool{color:#eadfff;filter:drop-shadow(0 0 14px rgba(173,125,255,.36))}
.mt-tool::before{content:"";position:absolute;inset:15%;border-radius:50%;background:currentColor;opacity:.075;filter:blur(15px);transform:scale(1.35)}
.mt-tool.t1{top:12%;--d:.02s;--r:-18deg;--s:.86}.mt-tool.t2{top:29%;--d:.1s;--r:13deg;--s:1.04}.mt-tool.t3{top:62%;--d:.04s;--r:-8deg;--s:.96}.mt-tool.t4{top:77%;--d:.14s;--r:18deg;--s:.82}.mt-tool.t5{top:43%;--d:.19s;--r:-15deg;--s:.9}.mt-tool.t6{top:6%;--d:.23s;--r:9deg;--s:.78}.mt-tool.t7{top:70%;--d:.25s;--r:-7deg;--s:.72}
#musicTransition.to-nova.active .mt-tool{animation:mtToolNova .9s cubic-bezier(.18,.72,.25,1) var(--d) both}
#musicTransition.to-kaido.active .mt-tool{animation:mtToolKaido .9s cubic-bezier(.18,.72,.25,1) var(--d) both}
.mt-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.86);display:flex;align-items:center;gap:14px;direction:ltr;color:#ecfbff;opacity:0;font:700 clamp(11px,1.1vw,15px)/1 Arial,sans-serif;letter-spacing:.34em;text-shadow:0 0 24px rgba(139,215,255,.45);white-space:nowrap}
.mt-center i{display:block;width:44px;height:1px;background:linear-gradient(90deg,transparent,currentColor,transparent);box-shadow:0 0 12px currentColor}
#musicTransition.active .mt-center{animation:mtCenter 1.06s cubic-bezier(.2,.7,.2,1) both}
#musicTransition.to-kaido .mt-center{color:#eadfff;text-shadow:0 0 24px rgba(179,135,255,.4)}
#musicTransition.settling{animation:mtBackdropOut .5s cubic-bezier(.4,0,.2,1) both}
#musicTransition.settling .mt-tool,#musicTransition.settling .mt-center,#musicTransition.settling .mt-wave{transition:opacity .24s ease;opacity:0!important}
@keyframes mtBackdropIn{from{opacity:0}to{opacity:1}}
@keyframes mtBackdropOut{0%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@keyframes mtFlash{0%{transform:translateX(-125%) skewX(-12deg);opacity:0}22%{opacity:.25}63%{opacity:.75}100%{transform:translateX(125%) skewX(-12deg);opacity:0}}
@keyframes mtWaveDash{to{stroke-dashoffset:-48}}
@keyframes mtWaveGlow{0%,100%{opacity:.12;transform:scaleY(.72)}45%{opacity:1;transform:scaleY(1.08)}}
@keyframes mtToolNova{0%{left:-14vw;transform:translate3d(-8vw,8vh,0) rotate(calc(var(--r) - 22deg)) scale(.56);opacity:0}15%{opacity:.32}48%{opacity:.96}100%{left:114vw;transform:translate3d(9vw,-12vh,0) rotate(calc(var(--r) + 42deg)) scale(var(--s));opacity:0}}
@keyframes mtToolKaido{0%{right:-14vw;transform:translate3d(8vw,-7vh,0) rotate(calc(var(--r) + 22deg)) scale(.56);opacity:0}15%{opacity:.3}48%{opacity:.94}100%{right:114vw;transform:translate3d(-9vw,12vh,0) rotate(calc(var(--r) - 42deg)) scale(var(--s));opacity:0}}
@keyframes mtCenter{0%,12%{opacity:0;transform:translate(-50%,-50%) scale(.82);filter:blur(8px)}42%{opacity:1;transform:translate(-50%,-50%) scale(1.03);filter:blur(0)}73%{opacity:.92;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08);filter:blur(3px)}}
@media(max-width:700px){.mt-tool{width:58px;height:58px}.mt-tool.t6,.mt-tool.t7{display:none}.mt-center{letter-spacing:.22em}.mt-wave{height:110px}}
@media(prefers-reduced-motion:reduce){#musicTransition.active .mt-tool,#musicTransition.active .mt-wave path,#musicTransition.active .mt-center,#musicTransition.active::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}


/* ===== Interactive KAIDO character controller v2 ===== */
#musicGuide{position:fixed;inset:0;z-index:72;pointer-events:none;font-family:"Cairo","Changa",Tahoma,Arial,sans-serif;direction:rtl;overflow:hidden;contain:layout paint}
#musicGuide .mg-wrap{position:absolute;bottom:clamp(58px,10vh,106px);width:min(620px,calc(100vw - 22px));display:flex;align-items:flex-end;gap:8px;opacity:0;visibility:hidden;transition:opacity .3s ease,transform .62s cubic-bezier(.2,.85,.18,1),visibility .3s;will-change:transform,opacity}
#musicGuide.side-right .mg-wrap{right:10px;transform:translateX(118%)}
#musicGuide.side-left .mg-wrap{left:10px;flex-direction:row-reverse;transform:translateX(-118%)}
#musicGuide.show .mg-wrap{opacity:1;visibility:visible;transform:translateX(0)}
#musicGuide.leaving.side-right .mg-wrap{opacity:0;transform:translateX(118%);transition-duration:.46s}
#musicGuide.leaving.side-left .mg-wrap{opacity:0;transform:translateX(-118%);transition-duration:.46s}

.mg-character-shell{width:248px;min-width:248px;height:372px;position:relative;pointer-events:none;filter:drop-shadow(0 23px 32px rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(84,158,255,.16));transform-origin:50% 100%;isolation:isolate;will-change:transform}
.mg-character-stage{position:absolute;inset:0;transform-origin:50% 100%;animation:mgLivingBreath 4.4s cubic-bezier(.4,0,.2,1) infinite}
.mg-pose{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0;transform:translate3d(0,4px,0) scale(.99);transform-origin:50% 100%;transition:opacity .25s ease,transform .38s cubic-bezier(.2,.8,.2,1),filter .28s ease;will-change:opacity,transform;user-select:none;-webkit-user-drag:none}
.mg-pose.active{opacity:1;transform:translate3d(0,0,0) scale(1);z-index:2}
#musicGuide[data-state="prepare"] .mg-pose.active{animation:mgPrepare .62s cubic-bezier(.2,.75,.2,1) both}
#musicGuide.speaking .mg-pose.active{animation:mgTalkLife .82s ease-in-out infinite}
#musicGuide[data-state="waiting"] .mg-pose.active{animation:mgWaitingLife 3.8s ease-in-out infinite}
#musicGuide[data-state="hover"] .mg-pose.active{filter:brightness(1.035) saturate(1.025)}
#musicGuide[data-state="click"] .mg-pose.active{animation:mgClickReaction .34s cubic-bezier(.2,.9,.3,1) both}
#musicGuide.micro-gesture .mg-character-stage{animation:mgMicroGesture .68s cubic-bezier(.25,.8,.25,1) both}
.mg-floor{position:absolute;left:36px;right:28px;bottom:3px;height:19px;border-radius:50%;background:radial-gradient(ellipse,rgba(98,177,255,.32),rgba(112,75,255,.14) 46%,transparent 74%);filter:blur(5px);opacity:.8;animation:mgFloor 3.2s ease-in-out infinite;z-index:-1}
.mg-note{position:absolute;z-index:4;font-weight:900;color:#d7f2ff;text-shadow:0 0 14px rgba(119,202,255,.95);opacity:0;font-size:21px;pointer-events:none}
#musicGuide.speaking .mg-note{animation:mgNote 1.75s ease-out infinite}
.mg-note.n1{right:9px;top:75px;animation-delay:.06s!important}.mg-note.n2{right:42px;top:38px;animation-delay:.61s!important;font-size:16px}.mg-note.n3{right:2px;top:126px;animation-delay:1.12s!important;font-size:17px}
.mg-status-ring{position:absolute;left:50%;top:45%;width:155px;height:155px;border-radius:50%;transform:translate(-50%,-50%) scale(.82);background:radial-gradient(circle,rgba(91,177,255,.12),rgba(91,177,255,.035) 48%,transparent 70%);opacity:0;transition:opacity .35s ease,transform .5s ease;z-index:-1;filter:blur(.2px)}
#musicGuide.speaking .mg-status-ring,#musicGuide[data-state="prepare"] .mg-status-ring{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}

.mg-bubble{position:relative;margin-bottom:166px;width:min(340px,calc(100vw - 260px));pointer-events:auto;opacity:0;visibility:hidden;transform:translateY(10px) scale(.965);transition:opacity .3s ease,transform .43s cubic-bezier(.2,.8,.2,1),visibility .3s}
#musicGuide.show.bubble-visible .mg-bubble{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.mg-card{width:100%;border:1px solid rgba(180,220,255,.19);border-radius:20px;padding:13px 14px 14px;color:#eef8ff;background:linear-gradient(145deg,rgba(10,20,31,.95),rgba(8,11,20,.97));box-shadow:0 18px 50px rgba(0,0,0,.44),0 0 0 1px rgba(255,255,255,.025) inset,0 0 30px rgba(83,166,255,.09);backdrop-filter:blur(16px);cursor:pointer;text-align:right;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;position:relative;overflow:hidden;outline:none}
.mg-card::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 10%,rgba(150,222,255,.08) 42%,rgba(255,210,126,.05) 50%,transparent 62%);transform:translateX(-125%)}
#musicGuide.bubble-visible .mg-card::before{animation:mgBubbleShine 3.5s ease-in-out 1.25s infinite}
.mg-card:hover,.mg-card:focus-visible{transform:translateY(-3px) scale(1.006);border-color:rgba(180,225,255,.42);box-shadow:0 20px 55px rgba(0,0,0,.46),0 0 36px rgba(92,183,255,.15)}
.mg-card:focus-visible{box-shadow:0 20px 55px rgba(0,0,0,.46),0 0 0 2px rgba(122,202,255,.62),0 0 36px rgba(92,183,255,.15)}
.mg-kicker{position:relative;z-index:1;display:flex;align-items:center;gap:7px;color:#86cfff;font-size:10px;font-weight:800;letter-spacing:.7px;margin-bottom:7px;opacity:.92}
.mg-kicker i{width:6px;height:6px;border-radius:50%;background:#8bddff;box-shadow:0 0 10px #79d8ff;animation:mgDot 1.15s ease-in-out infinite}
.mg-text{position:relative;z-index:1;font-size:14.5px;line-height:1.8;font-weight:700;min-height:50px;text-shadow:0 1px 10px rgba(0,0,0,.25)}
.mg-text::after{content:"";display:inline-block;width:5px;height:14px;margin-inline-start:3px;border-radius:3px;background:#8edcff;box-shadow:0 0 8px rgba(113,211,255,.7);vertical-align:-2px;opacity:0}
#musicGuide.speaking .mg-text::after{opacity:.85;animation:mgCaret .7s steps(1,end) infinite}
.mg-hint{position:relative;z-index:1;margin-top:8px;font-size:10.5px;color:#9baabb;display:flex;align-items:center;gap:5px;opacity:.78}.mg-hint b{color:#d8efff;font-size:13px}
.mg-tail{position:absolute;bottom:20px;width:18px;height:18px;background:#09121d;border-right:1px solid rgba(180,220,255,.18);border-bottom:1px solid rgba(180,220,255,.18);z-index:-1}
.side-right .mg-tail{right:-8px;transform:rotate(45deg)}.side-left .mg-tail{left:-8px;transform:rotate(225deg)}
.mg-close{position:absolute;top:-8px;left:-7px;width:25px;height:25px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(4,8,14,.9);color:#9fb3c6;display:grid;place-items:center;font:700 14px Arial;cursor:pointer;pointer-events:auto;opacity:.75;transition:.2s;z-index:3}.mg-close:hover{opacity:1;color:#fff;border-color:rgba(255,255,255,.28)}
.side-left .mg-close{left:auto;right:-7px}

@keyframes mgLivingBreath{0%,100%{transform:translate3d(0,0,0) scale(1)}48%{transform:translate3d(0,-1.6px,0) scale(1.002,1.004)}56%{transform:translate3d(0,-1.4px,0) scale(1.001,1.003)}}
@keyframes mgPrepare{0%{transform:translateY(2px) scale(.995)}52%{transform:translateY(-3px) scale(1.005)}100%{transform:translateY(0) scale(1)}}
@keyframes mgTalkLife{0%,100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}28%{transform:translate3d(0,-1.6px,0) rotate(.24deg) scale(1.002)}63%{transform:translate3d(0,-.4px,0) rotate(-.18deg) scale(1.001)}}
@keyframes mgWaitingLife{0%,100%{transform:translate3d(0,0,0)}48%{transform:translate3d(0,-1.15px,0)}54%{transform:translate3d(0,-1px,0)}}
@keyframes mgClickReaction{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-5px) scale(1.012)}100%{transform:translateY(0) scale(1)}}
@keyframes mgMicroGesture{0%,100%{transform:translate3d(0,0,0) rotate(0)}38%{transform:translate3d(1.5px,-2px,0) rotate(.28deg)}72%{transform:translate3d(-.7px,-.5px,0) rotate(-.14deg)}}
@keyframes mgFloor{0%,100%{opacity:.48;transform:scaleX(.9)}50%{opacity:.9;transform:scaleX(1.05)}}
@keyframes mgNote{0%{opacity:0;transform:translate(0,10px) rotate(0deg) scale(.7)}20%{opacity:.95}100%{opacity:0;transform:translate(16px,-48px) rotate(18deg) scale(1.08)}}
@keyframes mgBubbleShine{0%,70%{transform:translateX(-125%)}100%{transform:translateX(125%)}}
@keyframes mgDot{0%,100%{opacity:.45;transform:scale(.75)}50%{opacity:1;transform:scale(1.2)}}
@keyframes mgCaret{0%,49%{opacity:.82}50%,100%{opacity:.12}}

@media(max-width:700px){
  #musicGuide .mg-wrap{bottom:clamp(42px,9vh,78px);width:calc(100vw - 8px);gap:0}
  #musicGuide.side-right .mg-wrap{right:4px}#musicGuide.side-left .mg-wrap{left:4px}
  .mg-character-shell{width:166px;min-width:166px;height:249px}
  .mg-bubble{width:calc(100vw - 158px);margin-bottom:106px}
  .mg-card{padding:11px 11px 12px;border-radius:16px}.mg-text{font-size:12.6px;line-height:1.72;min-height:42px}.mg-kicker{font-size:9px}.mg-hint{font-size:9.2px}
  .mg-note.n1{top:50px}.mg-note.n2{top:26px}.mg-note.n3{top:84px}
}
@media(max-width:420px){.mg-character-shell{width:142px;min-width:142px;height:213px}.mg-bubble{width:calc(100vw - 132px);margin-bottom:91px}.mg-text{font-size:12px}.mg-hint{font-size:8.8px}.mg-card{padding:10px}}
@media(prefers-reduced-motion:reduce){#musicGuide .mg-wrap,.mg-bubble,.mg-pose{transition-duration:.01ms!important}.mg-character-stage,.mg-pose,.mg-note,.mg-floor,.mg-card::before,.mg-kicker i{animation:none!important}}


/* ===== KIDO VIRTUAL ASSISTANT v3 ===== */
:root{--kido-ai:#78c9ff;--kido-ai2:#7868ff;--kido-panel:rgba(7,12,22,.96)}
#musicGuide{z-index:76}
#musicGuide .mg-character-shell{pointer-events:auto;cursor:pointer}
#musicGuide.chat-open .mg-wrap{opacity:1;visibility:visible;transform:none!important}
#musicGuide.chat-open .mg-bubble{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
#musicGuide.free-pos .mg-wrap{left:var(--mg-x,10px)!important;right:auto!important;top:var(--mg-y,auto)!important;bottom:auto!important;transform:translateY(16px) scale(.97)!important}
#musicGuide.free-pos.show .mg-wrap{transform:translateY(0) scale(1)!important}
#musicGuide.free-pos.leaving .mg-wrap{transform:translateY(16px) scale(.97)!important;opacity:0!important}
#musicGuide.free-pos.side-left .mg-wrap{flex-direction:row-reverse}
#musicGuide.free-pos.side-right .mg-wrap{flex-direction:row}
#musicGuide.peek-mode .mg-character-shell{height:225px;overflow:hidden;border-radius:0 0 18px 18px}
#musicGuide.peek-mode .mg-character-stage{height:372px;inset:auto 0 0 0;bottom:-92px}
#musicGuide.peek-mode .mg-pose{height:372px;object-position:center bottom}
#musicGuide.peek-mode .mg-floor{display:none}
#musicGuide.peek-mode .mg-bubble{margin-bottom:82px}
#musicGuide[data-target-kind="video"] .mg-status-ring,#musicGuide[data-target-kind="image"] .mg-status-ring{opacity:.42;transform:translate(-50%,-50%) scale(1.05)}

#mgLauncher{position:fixed;z-index:5;right:18px;bottom:18px;display:flex;align-items:center;gap:9px;pointer-events:auto;border:1px solid rgba(151,211,255,.24);background:linear-gradient(145deg,rgba(7,15,27,.96),rgba(8,10,18,.97));color:#eef9ff;border-radius:999px;padding:9px 13px 9px 9px;box-shadow:0 14px 40px rgba(0,0,0,.38),0 0 28px rgba(70,164,255,.1);font:800 12px/1.1 Cairo,Tahoma,Arial,sans-serif;cursor:pointer;transition:.25s;backdrop-filter:blur(14px)}
#mgLauncher:hover{transform:translateY(-2px);border-color:rgba(151,211,255,.48);box-shadow:0 18px 46px rgba(0,0,0,.42),0 0 32px rgba(70,164,255,.16)}
#mgLauncher .mg-launch-avatar{width:34px;height:34px;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(95,191,255,.22),rgba(34,54,96,.18) 60%,transparent);border:1px solid rgba(255,255,255,.12)}
#mgLauncher .mg-launch-avatar img{position:absolute;width:58px;height:88px;max-width:none;left:50%;top:-8px;transform:translateX(-50%);object-fit:contain;object-position:center top}
#mgLauncher .mg-launch-copy{display:flex;flex-direction:column;align-items:flex-start;gap:2px;direction:rtl}
#mgLauncher small{font-size:8px;color:#7fd7ff;letter-spacing:.5px}#mgLauncher strong{font-size:11px}
#musicGuide.chat-open #mgLauncher{opacity:0;pointer-events:none;transform:translateY(8px)}

#mgChat{position:fixed;z-index:6;right:18px;bottom:18px;width:min(390px,calc(100vw - 24px));height:min(620px,calc(100vh - 36px));display:flex;flex-direction:column;pointer-events:auto;background:linear-gradient(155deg,rgba(8,15,27,.985),rgba(5,8,15,.985));border:1px solid rgba(155,215,255,.2);border-radius:24px;color:#edf7ff;box-shadow:0 28px 80px rgba(0,0,0,.56),0 0 50px rgba(75,158,255,.12);backdrop-filter:blur(20px);opacity:0;visibility:hidden;transform:translateY(18px) scale(.97);transition:.32s cubic-bezier(.2,.8,.2,1);overflow:hidden;direction:rtl}
#musicGuide.chat-open #mgChat{opacity:1;visibility:visible;transform:none}
.mg-chat-head{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(87,166,255,.08),transparent)}
.mg-chat-head-avatar{width:45px;height:45px;border-radius:15px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 28%,rgba(110,194,255,.23),rgba(25,38,72,.18) 63%,transparent);border:1px solid rgba(255,255,255,.1)}
.mg-chat-head-avatar img{position:absolute;width:78px;height:116px;max-width:none;left:50%;top:-10px;transform:translateX(-50%);object-fit:contain;object-position:center top}
.mg-chat-title{min-width:0;flex:1}.mg-chat-title strong{display:block;font-size:13px}.mg-chat-title span{display:flex;align-items:center;gap:5px;font-size:9.5px;color:#93a9bd;margin-top:3px}.mg-chat-title i{width:6px;height:6px;border-radius:50%;background:#55e7a4;box-shadow:0 0 9px #55e7a4}
.mg-head-actions{display:flex;gap:5px}.mg-icon-btn{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);color:#bcd0e2;display:grid;place-items:center;cursor:pointer;font-size:14px}.mg-icon-btn:hover{color:#fff;background:rgba(255,255,255,.07)}
#mgChatContext{padding:7px 13px;font-size:9px;color:#91a8bc;background:rgba(75,147,230,.045);border-bottom:1px solid rgba(255,255,255,.045);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mgChatContext b{color:#7dd8ff}
#mgMessages{flex:1;min-height:0;overflow:auto;padding:14px 12px 10px;scroll-behavior:smooth;overscroll-behavior:contain}
.mg-msg{display:flex;margin:8px 0}.mg-msg.user{justify-content:flex-start}.mg-msg.bot{justify-content:flex-end}
.mg-msg-box{max-width:86%;padding:10px 12px;border-radius:15px;font-size:12.3px;line-height:1.75;white-space:pre-wrap;box-shadow:0 8px 22px rgba(0,0,0,.16)}

function beginMusicTransition(targetPage) {
  if (!currentPage || currentPage === targetPage || !musicTransition) return false;
  if (typeof hideMusicGuide === 'function') hideMusicGuide(true);
  clearTimeout(transitionTimer);
  musicTransition.className = '';
  musicTransition.offsetWidth;
  musicTransition.classList.add('active', targetPage === 'nova' ? 'to-nova' : 'to-kaido');
  return true;
}

function endMusicTransition() {
  if (!musicTransition || !musicTransition.classList.contains('active')) return;
  musicTransition.classList.add('settling');
  transitionTimer = setTimeout(() => {
    musicTransition.className = '';
  }, 520);
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i=0; i<bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const mgHtmlCache=new Map();
async function mgCachedHtml(page){if(!mgHtmlCache.has(page))mgHtmlCache.set(page,unpackHtml(PACKED[page]).then(async html=>{try{const r=await fetch("/api/content",{cache:"no-store"});if(r.ok){const data=await r.json();const map={"nova": {"tracks": "NOVA_TRACKS", "visuals": "NOVA_VISUALS", "audio": "NOVA_AUDIO_ENGINEERING"}, "kaido": {"songs": "songs", "dass": "dass", "ads": "ads"}};for(const [key,name] of Object.entries(map[page]))html=html.replace(new RegExp("const "+name+"\\s*=\\s*\\[[\\s\\S]*?\\];"),"const "+name+"="+JSON.stringify(data[page][key])+";")}}catch(e){}return mgInjectBridge(html,page)}).catch(error=>{mgHtmlCache.delete(page);throw error}));return mgHtmlCache.get(page)}
async function unpackHtml(b64) {
  if (!('DecompressionStream' in window)) {
    throw new Error('هذا المتصفح قديم ولا يدعم فك الضغط المطلوب. افتح الملف بآخر إصدار من Chrome أو Edge.');
  }
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([b64ToBytes(b64)]).stream().pipeThrough(ds);
  return await new Response(stream).text();
}

function stateToHash(page, anchor='') {
  if (page === 'nova') return '#nova'+(anchor?'-'+encodeURIComponent(anchor):'');
  if (anchor) return '#kaido-' + encodeURIComponent(anchor);
  return '#kaido';
}

function hashToState() {
  const h = location.hash.replace(/^#/, '');
  if(h.startsWith('nova-')){try{return {page:'nova',anchor:decodeURIComponent(h.slice(5))}}catch(_){return {page:'nova',anchor:''}}}
  if (h === 'nova') return {page:'nova', anchor:''};
  if(h.startsWith('kaido-')){try{return {page:'kaido',anchor:decodeURIComponent(h.slice(6))}}catch(_){return {page:'kaido',anchor:''}}}
  return {page:'kaido', anchor:''};
}

  const sequence=++loadSequence;
  const switching = beginMusicTransition(page);
  boot.classList.remove('hide');
  try {
    const html = await mgCachedHtml(page);
    if (switching) await new Promise(resolve => setTimeout(resolve, 360));
    if(sequence!==loadSequence)return;
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    const nextUrl = URL.createObjectURL(blob);
    const oldUrl = currentUrl;
    currentUrl = nextUrl;
    currentPage = page;

    frame.onload = () => {
      boot.classList.add('hide');
      setTimeout(() => { try{ frame.contentWindow.postMessage({type:'KIDO_ASSIST_CONTEXT_PING'}, '*'); }catch(_){ } }, 160);
      if (switching) setTimeout(endMusicTransition, 260);
      if (oldUrl) setTimeout(() => URL.revokeObjectURL(oldUrl), 1200);
      frame.onload = null;
    };
    frame.src = nextUrl + (anchor ? '#' + encodeURIComponent(anchor) : '');

    const hash = stateToHash(page, anchor);
    const state = {page, anchor};
    if (historyMode === 'push') history.pushState(state, '', hash);
    else if (historyMode === 'replace') history.replaceState(state, '', hash);
  } catch (err) {
    if(sequence!==loadSequence)return;
    endMusicTransition();console.error(err);
    boot.textContent=String(err.message||err);
  }
}

addEventListener('message', (e) => {
  if(e.source!==frame.contentWindow)return;
  const d = e.data || {};
  if(d.type==='KIDO_VIEW_MOVED'){if(!mgChatOpen){hideMusicGuide(true);scheduleMusicGuide(2400)}return;}
  if(d.type==='KIDO_POINTER'){mgPointerLook(d.x,d.y);return;}
  if (d.type === 'KIDO_PAGE_CONTEXT') { mgHandlePageContext(d); return; }
  if (d.type === 'KIDO_SINGLE_ROUTE') { loadPage(d.page === 'nova' ? 'nova' : 'kaido', d.anchor || '', 'push'); return; }
});

addEventListener('popstate', (e) => {
  const s = e.state || hashToState();
  loadPage(s.page || 'kaido', s.anchor || '', 'none');
});

const initial = hashToState();
loadPage(initial.page, initial.anchor, 'replace');
mgMotionInit();
initMusicGuide();
</script>

Dialog .owner{padding:12px}#adminDialog .owner img{height:130px}#adminDialog .entry{flex-wrap:wrap}#adminDialog .entry img{width:70px}}

<dialog id="adminDialog" dir="rtl" aria-labelledby="adminTitle"><div class="top"><div><small class="muted">KAIDO × NOVA / CONTROL ROOM</small><h2 id="adminTitle">لوحة الإدارة</h2></div><button id="adminClose" aria-label="إغلاق">✕</button></div><p id="adminNotice" role="status" aria-live="polite"></p><div id="adminBody"></div></dialog>
<script>
(()=>{
const dialog=document.getElementById('adminDialog'),body=document.getElementById('adminBody'),notice=document.getElementById('adminNotice');let csrf='',owner='nova',category='tracks',data={},busy=false;
const labels={nova:{tracks:'من أجمل التراكات',visuals:'أعمال الفيديو',audio:'الهندسة الصوتية'},kaido:{songs:'أعمالي',dass:'الدسات',ads:'الإعلانات'}};
const logos={"nova": "__KN_MEDIA:9885f0396c96__", "kaido": "__KN_MEDIA:f6a938b75ee9__"};
function say(s){notice.textContent=s}
async function api(path,payload){if(location.protocol==='file:')throw Error('خدمة الإدارة غير متاحة. تأكد من رفع مجلد api وإعداد قاعدة البيانات على Vercel ثم أعد النشر.');const r=await fetch('/api/'+path,{credentials:'same-origin',cache:'no-store',method:payload?'POST':'GET',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:payload?JSON.stringify(payload):undefined});let d;try{d=await r.json()}catch(e){throw Error('خدمة الإدارة غير متاحة. تأكد من رفع مجلد api وإعداد قاعدة البيانات على Vercel ثم أعد النشر.')}if(!r.ok)throw Error(d.error||'تعذر تنفيذ الطلب');return d}
function login(){body.innerHTML='<form id="loginForm"><p class="muted">دخول المسؤولين فقط</p><label>اسم المستخدم<input name="username" required autocomplete="username" placeholder="kaido / nova"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><button>متابعة ←</button></form>';body.querySelector('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{await api('login',Object.fromEntries(new FormData(e.target)));say('أدخل رمز التوول لإكمال الدخول.');tool()}catch(e){say(e.message)}finally{busy=false}}}
function tool(){body.innerHTML='<form><label>رمز التوول<input name="code" type="password" required autocomplete="off" autofocus></label><button>فتح لوحة الإدارة</button></form>';body.querySelector('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const r=await api('verify',Object.fromEntries(new FormData(e.target)));csrf=r.csrf;await dashboard();say('تم تسجيل الدخول بنجاح.')}catch(e){say(e.message)}finally{busy=false}}}
async function dashboard(){data=await api('content');body.innerHTML='<div class="top"><p class="muted">اختر الفنان لإدارة قوائمه</p><button id="logout">تسجيل الخروج</button></div><div class="owners"><button class="owner" data-owner="nova"><img alt="NOVA"><b>NOVA / نوفا</b></button><button class="owner" data-owner="kaido"><img alt="KI DO"><b>KI DO / كايدو</b></button></div>';body.querySelectorAll('[data-owner]').forEach(b=>{b.querySelector('img').src=logos[b.dataset.owner];b.onclick=()=>{owner=b.dataset.owner;category=Object.keys(labels[owner])[0];editor()}});body.querySelector('#logout').onclick=async()=>{try{await api('logout',{});csrf='';say('تم تسجيل الخروج.');login()}catch(e){say(e.message)}}}
function editor(){body.innerHTML='<div class="top"><h3>'+owner.toUpperCase()+' / إدارة الأعمال</h3><button id="back">← الفنانين</button></div><div class="tabs"></div><form id="addVideo"><label>رابط فيديو يوتيوب<input name="url" type="url" required placeholder="https://www.youtube.com/watch?v=..."></label><button>＋ إضافة الفيديو</button></form><p class="muted" id="count"></p><div id="entries"></div>';body.querySelector('#back').onclick=()=>dashboard().catch(e=>say(e.message));for(const [key,label]of Object.entries(labels[owner])){const b=document.createElement('button');b.textContent=label;b.className=key===category?'active':'';b.onclick=()=>{category=key;editor()};body.querySelector('.tabs').append(b)}const list=data[owner][category];body.querySelector('#count').textContent=list.length+' فيديو • التغييرات تظهر لكل الزوار';if(!list.length)body.querySelector('#entries').textContent='القائمة فارغة. أضف أول فيديو.';list.forEach(id=>{const row=document.createElement('div');row.className='entry';const im=document.createElement('img');im.src='https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';im.alt='معاينة الفيديو';const a=document.createElement('a');a.href='https://www.youtube.com/watch?v='+id;a.target='_blank';a.rel='noopener noreferrer';a.textContent=id+' ↗';const b=document.createElement('button');b.className='danger';b.textContent='حذف';b.onclick=()=>{if(confirm('حذف هذا الفيديو من القائمة؟'))mutate({action:'delete',url:id})};row.append(im,a,b);body.querySelector('#entries').append(row)});body.querySelector('#addVideo').onsubmit=e=>{e.preventDefault();mutate({action:'add',url:new FormData(e.target).get('url')})}}
async function mutate(change){if(busy)return;busy=true;try{data=await api('content',{owner,category,...change});editor();say(change.action==='add'?'تمت إضافة الفيديو وحفظه.':'تم حذف الفيديو وحفظ التعديل.');mgHtmlCache.clear();loadPage(currentPage||'kaido','','replace')}catch(e){say(e.message)}finally{busy=false}}
async function open(){if(!dialog.open)dialog.showModal();say('');try{const s=await api('session');if(s.csrf){csrf=s.csrf;await dashboard()}else if(s.pending){tool();say('أدخل رمز التوول لإكمال الدخول.')}else login()}catch(e){login();say(e.message)}}
document.getElementById('adminClose').onclick=()=>dialog.close();window.addEventListener('message',e=>{if(e.source===document.getElementById('app').contentWindow&&e.data?.type==='ADMIN_OPEN')open()});
})();
</script>
